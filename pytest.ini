[pytest]

# 🔹 Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 🔹 Console output (more readable logs)
addopts = 
    -v
    --tb=short
    --disable-warnings
    --alluredir=reports/allure-results

# 🔹 Markers (useful for grouping tests)
markers =
    smoke: Smoke tests
    regression: Regression tests
    login: Login related tests
    notes: Notes feature tests
    e2e: End-to-end tests

# 🔹 Logging (console-level control)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 🔹 Timeout (optional safety)
# timeout = 300

# 🔹 Parallel execution default (optional)
# You can override via CLI: pytest -n 4
# addopts = -n auto
